# Integración continua: cada push y pull request debe pasar lint, tipos, pruebas, auditoría y build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pidelo
          POSTGRES_PASSWORD: pidelo
          POSTGRES_DB: pidelo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pidelo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pidelo:pidelo@localhost:5432/pidelo_test
      TEST_DATABASE_URL: postgresql://pidelo:pidelo@localhost:5432/pidelo_test
      SESSION_SECRET: ci-secreto-de-sesion-de-al-menos-32-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npx next build
