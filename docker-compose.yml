# Base de datos local para desarrollo (misma tecnología que en producción).
# Uso: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pidelo
      POSTGRES_PASSWORD: pidelo
      POSTGRES_DB: pidelo
    ports:
      - "5432:5432"
    volumes:
      - pidelo-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pidelo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pidelo-pg:
